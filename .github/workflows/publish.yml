name: Publish

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - .gitignore
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Auto-bump patch version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg_name=$(node -p "require('./package.json').name")
          local_version=$(node -p "require('./package.json').version")
          local_major_minor=$(echo "$local_version" | cut -d. -f1,2)

          published_version=$(npm view "$pkg_name" version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")

          if [ -z "$published_version" ]; then
            new_version="${local_major_minor}.0"
          else
            pub_major_minor=$(echo "$published_version" | cut -d. -f1,2)
            pub_patch=$(echo "$published_version" | cut -d. -f3)

            if [ "$local_major_minor" = "$pub_major_minor" ]; then
              new_version="${local_major_minor}.$((pub_patch + 1))"
            else
              new_version="${local_major_minor}.0"
            fi
          fi

          echo "Local $local_version, published ${published_version:-none}, publishing $new_version"

          if [ "$new_version" != "$local_version" ]; then
            npm version "$new_version" --no-git-tag-version
          fi

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
